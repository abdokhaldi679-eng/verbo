name: APK Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Construire l’APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les paquets Android requis
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code
        run: npm run lint

      - name: Construire l’application web
        run: npm run build

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Construire l’APK de test
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l’APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "Verbo-${VERSION}-android-debug.apk"
          sha256sum "Verbo-${VERSION}-android-debug.apk" > "Verbo-${VERSION}-android-debug.apk.sha256"

      - name: Publier l’APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: verbo-apk-android
          path: |
            Verbo-*-android-debug.apk
            Verbo-*-android-debug.apk.sha256
          retention-days: 14

      - name: Ajouter l’APK à la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Verbo-*-android-debug.apk
            Verbo-*-android-debug.apk.sha256
          fail_on_unmatched_files: true
